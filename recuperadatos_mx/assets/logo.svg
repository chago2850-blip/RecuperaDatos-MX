<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>RecuperaDatos-MX</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14365A"/>
      <stop offset="1" stop-color="#081322"/>
    </linearGradient>
    <radialGradient id="platter" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#E9F7FF"/>
      <stop offset="0.45" stop-color="#9FB9CC"/>
      <stop offset="1" stop-color="#4A6378"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EF2C4"/>
      <stop offset="1" stop-color="#18A0FB"/>
    </linearGradient>
    <linearGradient id="file" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- fondo squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- plato del disco -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="262" r="138" fill="url(#platter)"/>
    <circle cx="256" cy="262" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="256" cy="262" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="256" cy="262" r="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="256" cy="262" r="30" fill="#2B4157"/>
    <circle cx="256" cy="262" r="12" fill="#C9D8E4"/>
  </g>
  <!-- flecha circular de recuperación -->
  <g filter="url(#glow)" fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M 122 200 A 152 152 0 1 1 132 352" stroke-width="26"/>
  </g>
  <path d="M 76 182 L 164 214 L 102 292 Z" fill="#2EF2C4" stroke="#2EF2C4" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- archivo rescatado -->
  <g transform="translate(300 300) rotate(-8)" filter="url(#shadow)">
    <path d="M0 0 h64 l28 28 v86 a10 10 0 0 1 -10 10 h-82 a10 10 0 0 1 -10 -10 v-104 a10 10 0 0 1 10 -10 z"
          transform="translate(-10 -10)" fill="url(#file)"/>
    <path d="M54 -10 v28 a10 10 0 0 0 10 10 h28" fill="#FFF3C4"/>
    <rect x="8" y="40" width="56" height="8" rx="4" fill="#8A5A00" opacity="0.55"/>
    <rect x="8" y="58" width="64" height="8" rx="4" fill="#8A5A00" opacity="0.45"/>
    <rect x="8" y="76" width="44" height="8" rx="4" fill="#8A5A00" opacity="0.35"/>
  </g>
  <!-- acento tricolor MX -->
  <g transform="translate(176 438)">
    <rect x="0" y="0" width="52" height="10" rx="5" fill="#00A86B"/>
    <rect x="58" y="0" width="44" height="10" rx="5" fill="#F4F6F8"/>
    <rect x="108" y="0" width="52" height="10" rx="5" fill="#E03A3E"/>
  </g>
</svg>
