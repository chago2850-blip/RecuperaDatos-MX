name: Compilar instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools mtools exfatprogs exfat-fuse ntfs-3g ffmpeg ewf-tools
          pip install -r requirements.txt pytest
      - name: Imágenes de prueba
        run: sudo -E env "PATH=$PATH" python tests/build_images.py /tmp/rdt && sudo chmod -R a+r /tmp/rdt
      - name: Imágenes reales de macOS, Windows y Linux
        run: python tests/get_test_data.py /tmp/dp
      - name: Pruebas
        run: RD_IMAGES=/tmp/rdt RD_DATOS=/tmp/dp QT_QPA_PLATFORM=offscreen python -m pytest -q tests

  compilar:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-15
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libxcb-cursor0 libegl1
      - name: Dependencias de Python
        run: pip install -r requirements.txt pyinstaller
      - name: Compilar
        run: python packaging/build.py
      - name: Prueba del ejecutable (Linux)
        if: runner.os == 'Linux'
        run: build/pyi-dist/RecuperaDatos-MX/RecuperaDatos-MX --version
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publicar:
    needs: compilar
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: ver
        run: echo "v=$(python3 -c 'import recuperadatos_mx as r; print(r.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: RecuperaDatos-MX ${{ steps.ver.outputs.v }}
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: false
          body: |
            ## Descargas
            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 (64 bits) | `RecuperaDatos-MX-*-windows-setup.exe` (instalador) o `*-windows-portable.zip` |
            | macOS Apple Silicon (M1–M4) | `RecuperaDatos-MX-*-macos-arm64.dmg` |
            | macOS Intel | `RecuperaDatos-MX-*-macos-x86_64.dmg` |
            | Debian / Ubuntu / Mint | `recuperadatos-mx_*_amd64.deb` |
            | Fedora / openSUSE / RHEL | `recuperadatos-mx-*.x86_64.rpm` |
            | Cualquier Linux | `RecuperaDatos-MX-*-linux-x86_64.tar.gz` |

            | Memoria USB de arranque | `RecuperaDatos-MX-*-live-amd64.iso` (se agrega unos minutos después; grábela desde la app en «Medio de arranque» o con balenaEtcher/Rufus) |

            Ejecute la aplicación como administrador para leer discos físicos. Licencia GPL-3.0 o posterior.

  live:
    needs: publicar
    if: ${{ !cancelled() && needs.publicar.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - run: apt-get update -qq && apt-get install -y -qq live-build ca-certificates git python3 xorriso apt-utils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: instaladores-ubuntu-22.04
          path: deb
      - name: Versión
        id: ver
        run: echo "v=$(python3 -c 'import recuperadatos_mx as r; print(r.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Construir ISO live
        run: sh packaging/live/build-live.sh deb/recuperadatos-mx_${{ steps.ver.outputs.v }}_amd64.deb ${{ steps.ver.outputs.v }} > /tmp/lb.log 2>&1 || (tail -40 /tmp/lb.log | sed 's/^/::warning::/'; exit 1)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: /tmp/RecuperaDatos-MX-${{ steps.ver.outputs.v }}-live-amd64.iso
